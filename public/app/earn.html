    <script>
      document.addEventListener('DOMContentLoaded', function () {
        const monthlyIncomeInput = document.getElementById('monthly-income');
        const workStartInput = document.getElementById('work-start');
        const lunchStartInput = document.getElementById('lunch-start');
        const lunchEndInput = document.getElementById('lunch-end');
        const workEndInput = document.getElementById('work-end');
        const workDaysSelect = document.getElementById('work-days');
        const customDaysContainer = document.getElementById(
          'custom-days-container'
        );
        const customDaysInput = document.getElementById('custom-days');
        const calculateBtn = document.getElementById('calculate-btn');
        const resetBtn = document.getElementById('reset-btn');
        const incomeResult = document.getElementById('income-result');
        const incomeLabel = document.getElementById('income-label');
        const dailySalaryElement = document.getElementById('daily-salary');
        const hourlySalaryElement = document.getElementById('hourly-salary');
        const workedDaysElement = document.getElementById('worked-days');
        const workedHoursElement = document.getElementById('worked-hours');
        const lastUpdatedElement = document.getElementById('last-updated');
        const settingsContainer = document.getElementById('settings-container');
        const settingsToggle = document.querySelector('.settings-toggle');
        const saveIndicator = document.getElementById('save-indicator');
        const toggleBtns = document.querySelectorAll('.toggle-btn');

        let updateInterval;
        let lastIncome = 0;
        let currentPeriod = 'daily'; // daily, monthly, yearly

        // 设置当前年份
        document.getElementById('current-year').textContent =
          new Date().getFullYear();

        // 切换收入显示类型
        toggleBtns.forEach(btn => {
          btn.addEventListener('click', function () {
            // 移除所有按钮的active类
            toggleBtns.forEach(b => b.classList.remove('active'));
            // 给当前按钮添加active类
            this.classList.add('active');
            // 更新当前周期
            currentPeriod = this.dataset.period;
            // 重新计算收入
            if (monthlyIncomeInput.value) {
              calculateIncome();
            }
          });
        });

        // 加载保存的设置
        loadSavedSettings();

        // 显示/隐藏设置区域
        settingsToggle.addEventListener('click', function () {
          settingsContainer.classList.toggle('visible');
          settingsToggle.textContent = settingsContainer.classList.contains(
            'visible'
          )
            ? '✕'
            : '⚙️';
        });

        // 显示/隐藏自定义工作天数输入框
        workDaysSelect.addEventListener('change', function () {
          if (this.value === 'custom') {
            customDaysContainer.style.display = 'block';
          } else {
            customDaysContainer.style.display = 'none';
          }
          saveSettings();
        });

        // 输入变化时保存设置
        const inputElements = [
          monthlyIncomeInput,
          workStartInput,
          lunchStartInput,
          lunchEndInput,
          workEndInput,
          workDaysSelect,
          customDaysInput,
        ];

        inputElements.forEach(input => {
          input.addEventListener('change', saveSettings);
        });

        // 计算按钮点击事件
        calculateBtn.addEventListener('click', function () {
          // 清除之前的定时器
          if (updateInterval) {
            clearInterval(updateInterval);
          }

          // 隐藏设置区域
          settingsContainer.classList.remove('visible');
          settingsToggle.textContent = '⚙️';

          calculateIncome();
          // 每秒更新一次，实现跳动效果
          updateInterval = setInterval(calculateIncome, 1000);

          // 保存设置
          saveSettings();
        });

        // 重置按钮点击事件
        resetBtn.addEventListener('click', function () {
          if (confirm('确定要重置所有设置吗？这将清除所有保存的数据。')) {
            localStorage.removeItem('incomeCalculatorSettings');
            location.reload();
          }
        });

        function calculateIncome() {
          // 获取输入值
          const monthlyIncome = parseFloat(monthlyIncomeInput.value);
          if (isNaN(monthlyIncome) || monthlyIncome <= 0) {
            alert('请输入有效的月收入');
            return;
          }

          // 获取工作天数
          let workDaysPerMonth;
          if (workDaysSelect.value === 'custom') {
            workDaysPerMonth = parseFloat(customDaysInput.value);
            if (
              isNaN(workDaysPerMonth) ||
              workDaysPerMonth <= 0 ||
              workDaysPerMonth > 31
            ) {
              alert('请输入有效的工作天数（1-31）');
              return;
            }
          } else {
            workDaysPerMonth = parseFloat(workDaysSelect.value);
          }

          // 计算日薪
          const dailySalary = monthlyIncome / workDaysPerMonth;

          // 计算每日工作小时数
          const workStartTime = timeStringToDate(workStartInput.value);
          const lunchStartTime = timeStringToDate(lunchStartInput.value);
          const lunchEndTime = timeStringToDate(lunchEndInput.value);
          const workEndTime = timeStringToDate(workEndInput.value);

          const morningHours =
            (lunchStartTime - workStartTime) / (1000 * 60 * 60);
          const afternoonHours =
            (workEndTime - lunchEndTime) / (1000 * 60 * 60);
          const dailyWorkHours = morningHours + afternoonHours;

          // 计算时薪
          const hourlySalary = dailySalary / dailyWorkHours;

          // 获取当前日期和时间
          const now = new Date();
          const currentYear = now.getFullYear();
          const currentMonth = now.getMonth();

          // 计算本月第一天
          const firstDayOfMonth = new Date(currentYear, currentMonth, 1);

          // 计算本月已过天数（包括今天）
          const daysPassed =
            Math.floor((now - firstDayOfMonth) / (1000 * 60 * 60 * 24)) + 1;

          // 计算本月工作日（从1号到今天）
          let workedDays = 0;
          for (let i = 0; i < daysPassed; i++) {
            const date = new Date(currentYear, currentMonth, i + 1);
            // 简单假设：周一至周五为工作日
            if (date.getDay() !== 0 && date.getDay() !== 6) {
              workedDays++;
            }
          }

          // 计算今天已工作小时数
          let workedHoursToday = 0;
          const currentTime =
            now.getHours() + now.getMinutes() / 60 + now.getSeconds() / 3600;

          if (currentTime >= timeStringToHours(workStartInput.value)) {
            // 上午工作时间计算
            const morningEnd = Math.min(
              currentTime,
              timeStringToHours(lunchStartInput.value)
            );
            workedHoursToday += Math.max(
              0,
              morningEnd - timeStringToHours(workStartInput.value)
            );

            // 如果已经过了午休时间，计算下午工作时间
            if (currentTime > timeStringToHours(lunchEndInput.value)) {
              workedHoursToday += Math.min(
                currentTime - timeStringToHours(lunchEndInput.value),
                timeStringToHours(workEndInput.value) -
                  timeStringToHours(lunchEndInput.value)
              );
            }
          }

          // 根据选择的周期计算收入
          let displayIncome = 0;
          let labelText = '';

          switch (currentPeriod) {
            case 'daily':
              // 今日收入
              // 如果今天是周末，不挣钱
              if (now.getDay() === 0 || now.getDay() === 6) {
                displayIncome = 0;
                labelText = '今天是周末，休息哦~';
                break;
              }
              // 还没有到开工时间
              if (currentTime < timeStringToHours(workStartInput.value)) {
                displayIncome = 0;
                labelText = '今天还没到开工时间哦~';
                break;
              }
              // 计算今日收入

              displayIncome = workedHoursToday * hourlySalary;
              labelText = '今日收入为';
              break;

            case 'monthly':
              // 本月收入
              // 实时收入计算（原逻辑）
              totalIncome = 0;
              if (workedDays > 0) {
                const fullDays =
                  currentTime < timeStringToHours(workEndInput.value)
                    ? workedDays - 1
                    : workedDays;
                totalIncome += fullDays * dailySalary;

                // 今天不是周末，才需要计算今日收入
                if (now.getDay() !== 0 && now.getDay() !== 6) {
                  if (currentTime >= timeStringToHours(workStartInput.value)) {
                    totalIncome += workedHoursToday * hourlySalary;
                  }
                }
              }
              displayIncome = totalIncome;
              labelText = '本月收入为';
              break;

            case 'yearly':
              // 本年收入（基于实际工作日计算）
              let yearlyIncome = 0;
              const currentYear = now.getFullYear();
              const currentMonth = now.getMonth(); // 0-11

              // 计算已完整工作的月份收入
              for (let month = 0; month < currentMonth; month++) {
                yearlyIncome += monthlyIncome;
              }

              // 加上当前月份的收入（使用本月收入的计算逻辑）
              let currentMonthIncome = 0;
              if (workedDays > 0) {
                const fullDays =
                  currentTime < timeStringToHours(workEndInput.value)
                    ? workedDays - 1
                    : workedDays;
                currentMonthIncome += fullDays * dailySalary;

                // 今天不是周末，才需要计算今日收入
                if (now.getDay() !== 0 && now.getDay() !== 6) {
                  if (currentTime >= timeStringToHours(workStartInput.value)) {
                    currentMonthIncome += workedHoursToday * hourlySalary;
                  }
                }
              }

              yearlyIncome += currentMonthIncome;
              displayIncome = yearlyIncome;
              labelText = '本年收入为';
              break;
          }

          // 添加跳动效果
          if (displayIncome > lastIncome) {
            incomeResult.classList.add('increasing');
            setTimeout(() => {
              incomeResult.classList.remove('increasing');
            }, 500);
          }

          // 更新UI
          incomeLabel.textContent = labelText;
          incomeResult.textContent = displayIncome.toFixed(2) + ' 元';
          dailySalaryElement.textContent = dailySalary.toFixed(2) + ' 元';
          hourlySalaryElement.textContent = hourlySalary.toFixed(2) + ' 元';
          workedDaysElement.textContent = workedDays + ' 天';
          workedHoursElement.textContent =
            workedHoursToday.toFixed(2) + ' 小时';

          // 更新最后更新时间
          lastUpdatedElement.textContent = '最后更新: ' + now.toLocaleString();

          // 保存当前收入用于下次比较
          lastIncome = displayIncome;
        }

        // 保存设置到localStorage
        function saveSettings() {
          const settings = {
            monthlyIncome: monthlyIncomeInput.value,
            workStart: workStartInput.value,
            lunchStart: lunchStartInput.value,
            lunchEnd: lunchEndInput.value,
            workEnd: workEndInput.value,
            workDays: workDaysSelect.value,
            customDays: customDaysInput.value,
          };

          localStorage.setItem(
            'incomeCalculatorSettings',
            JSON.stringify(settings)
          );

          // 显示保存提示
          saveIndicator.classList.add('visible');
          setTimeout(() => {
            saveIndicator.classList.remove('visible');
          }, 2000);
        }

        // 从localStorage加载设置
        function loadSavedSettings() {
          const savedSettings = localStorage.getItem(
            'incomeCalculatorSettings'
          );

          if (savedSettings) {
            const settings = JSON.parse(savedSettings);

            monthlyIncomeInput.value = settings.monthlyIncome || '';
            workStartInput.value = settings.workStart || '09:00';
            lunchStartInput.value = settings.lunchStart || '12:00';
            lunchEndInput.value = settings.lunchEnd || '13:00';
            workEndInput.value = settings.workEnd || '18:00';
            workDaysSelect.value = settings.workDays || '22';
            customDaysInput.value = settings.customDays || '';

            // 显示自定义天数输入框（如果选择了自定义）
            if (workDaysSelect.value === 'custom') {
              customDaysContainer.style.display = 'block';
            }

            // 如果月收入已设置，自动开始计算
            if (monthlyIncomeInput.value) {
              // 清除之前的定时器
              if (updateInterval) {
                clearInterval(updateInterval);
              }

              // 隐藏设置区域
              settingsContainer.classList.remove('visible');
              settingsToggle.textContent = '⚙️';

              // 立即计算一次
              calculateIncome();
              // 每秒更新一次，实现跳动效果
              updateInterval = setInterval(calculateIncome, 1000);
            }
          }
        }

        // 辅助函数：将时间字符串转换为Date对象（今天日期）
        function timeStringToDate(timeString) {
          const [hours, minutes] = timeString.split(':').map(Number);
          const date = new Date();
          date.setHours(hours, minutes, 0, 0);
          return date;
        }

        // 辅助函数：将时间字符串转换为小时数
        function timeStringToHours(timeString) {
          const [hours, minutes] = timeString.split(':').map(Number);
          return hours + minutes / 60;
        }
      });
    </script>
  </body>
</html>
